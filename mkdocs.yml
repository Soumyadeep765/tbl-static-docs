
site_name: TBL Docs
site_url: https://soumyadeep765.github.io/
site_description: Official documentation for TBL platform.
site_author: TeleBotHost

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en

  icon:
    previous: fontawesome/solid/arrow-left
    next: fontawesome/solid/arrow-right

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.highlight
    - search.share
    - search.suggest
    - toc.integrate
    - content.tooltips
    - content.action.view
    - content.code.annotate
    - content.code.copy

  font:
    text: Roboto
    code: JetBrains Mono

  meta:
    viewport: "width=device-width, initial-scale=1, shrink-to-fit=no"
    description: "Official documentation for TBL - TeleBotHost"
    author: "TeleBotHost"
    keywords: "TeleBot, TeleBotHost "

extra:
  generator: false

  consent:
    title: Cookie Consent
    description: >
      We use cookies to enhance your browsing experience and analyze site traffic.
    actions:
      - accept
      - reject
    cookie:
      name: mkdocs-consent
      expires: 365

  last_update:
    date: true

  tags: true

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 3
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - pymdownx.magiclink:
      hide_protocol: true

