site_name: TBL Documentation
site_url: https://docs.telebothost.com
site_description: Official TBL (Tele Bot Language) documentation on TeleBotHost — tutorials, Api reference, webhooks, and Telegram bot hosting guides.
site_author: TeleBotHost
repo_url: https://github.com/TeleBotHost
edit_uri: ""

# Required for canonical URLs; sitemap is generated by hooks/seo.py on build
use_directory_urls: true
strict: false

hooks:
  - hooks/seo.py

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en

  icon:
    previous: fontawesome/solid/arrow-left
    next: fontawesome/solid/arrow-right

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - toc.integrate
    - content.tooltips
    - content.action.view
    - content.code.annotate
    - content.code.copy

  font:
    text: Roboto
    code: JetBrains Mono

extra:

  generator: false
  homepage: https://docs.telebothost.com

  # Site-wide defaults (overridden per page by hooks/seo.py)
  meta:
    og:type: website
    og:site_name: TeleBotHost Docs
    og:locale: en_US
    twitter:card: summary_large_image
    twitter:site: "@telebothost"

  consent:
    title: Cookie Consent
    description: >
      We use cookies to improve your browsing experience and analyze website traffic.
    actions:
      - accept
      - reject
    cookie:
      name: mkdocs-consent
      expires: 365

  last_update:
    date: true
    datetime_format: "%B %d, %Y"

  tags: true

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TeleBotHost
    - icon: fontawesome/solid/globe
      link: https://telebothost.com

copyright: |
  Copyright © 2026 TeleBotHost.
  Built with ❤️ by TeleBotHost Team.

plugins:
  - search:
      lang: en
      separator: '[\s\-]+'
  - minify:
      minify_html: true

markdown_extensions:

  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true

  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

  - toc:
      permalink: true
      toc_depth: 3

  - footnotes
  - def_list

  - pymdownx.tasklist:
      custom_checkbox: true

  - attr_list

  - pymdownx.magiclink:
      hide_protocol: true

